<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Africa Vision Voyage Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: barre latérale bleu nuit (navigation des 11 modules) + espace de travail clair ; accent ambre "soleil couchant" */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --soft:#eaf0f5; --ink:#132033; --muted:#5d6b7c; --line:#dce3eb;
  --accent:#d97d22; --accent-ink:#ffffff; --accent-soft:#fbeedd;
  --nav:#0f2338; --nav-ink:#b9c8d9; --nav-active:#1c3653;
  --good:#1d7f54; --good-soft:#e1f3ea; --warn:#a86b12; --warn-soft:#fbf0dc;
  --bad:#b9381a; --bad-soft:#fbe6e0; --info:#235f9e; --info-soft:#e2edf9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px; --mod:#d97d22; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1520; --surface:#122130; --soft:#182a3c; --ink:#e5edf5; --muted:#93a4b6; --line:#24384c;
    --accent:#f0a04b; --accent-ink:#1d1206; --accent-soft:#3a2a17;
    --nav:#07111b; --nav-ink:#9fb1c4; --nav-active:#15283b;
    --good:#4cc492; --good-soft:#143428; --warn:#e5b04f; --warn-soft:#382c14;
    --bad:#f08060; --bad-soft:#3c1d16; --info:#78b0ec; --info-soft:#152b42; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1520; --surface:#122130; --soft:#182a3c; --ink:#e5edf5; --muted:#93a4b6; --line:#24384c;
  --accent:#f0a04b; --accent-ink:#1d1206; --accent-soft:#3a2a17;
  --nav:#07111b; --nav-ink:#9fb1c4; --nav-active:#15283b;
  --good:#4cc492; --good-soft:#143428; --warn:#e5b04f; --warn-soft:#382c14;
  --bad:#f08060; --bad-soft:#3c1d16; --info:#78b0ec; --info-soft:#152b42; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:18px} h3{font-size:15px}
.num,td.num,.tab{font-variant-numeric:tabular-nums}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px}
.brand svg{flex:none}
.brand img{flex:none;max-width:64px;max-height:52px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.logo-prev{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo-prev .box{width:140px;height:96px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-prev .box img{max-width:130px;max-height:86px;object-fit:contain}
.brand b{display:block;font-family:var(--display);color:#fff;font-size:15px;line-height:1.15;letter-spacing:.02em}
.brand small{color:var(--nav-ink);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px 16px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f86a0;padding:14px 10px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:6px 10px 6px 6px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
.nav a .ic{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.nav a:hover{background:color-mix(in srgb,var(--c) 14%,transparent);color:#fff}
.nav a.on{background:color-mix(in srgb,var(--c) 26%,transparent);color:#fff;border-left-color:var(--c)}
.nav a.on .ic{background:var(--c);color:#fff}
.nav a .cnt{margin-left:auto;font-size:12px;color:#6f86a0}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#6f86a0;border-top:1px solid #1b3149}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#6f86a0}
.dot.ok{background:#4cc492} .dot.loc{background:#e5b04f}

.main{overflow-y:auto;min-width:0;position:relative;isolation:isolate}
.bgart{position:fixed;inset:0 0 0 248px;pointer-events:none;z-index:-1;overflow:hidden;color:var(--mod)}
.bgart svg{position:absolute;right:-40px;bottom:-30px;width:min(62vw,760px);height:auto;opacity:.11}
.bgart .cl{position:absolute;left:4%;top:90px;width:min(40vw,420px);opacity:.05;color:var(--ink)}
.side{position:relative}
.side .sideplane{position:absolute;right:-30px;bottom:60px;width:190px;opacity:.06;color:#fff;pointer-events:none}
.head h1{display:flex;align-items:center;gap:10px}
.head h1 .hic{width:36px;height:36px;border-radius:9px;background:var(--mod);color:#fff;display:grid;place-items:center;flex:none}
.wrap,.modal{--accent:var(--mod);--accent-ink:#fff}
.top{display:none}
.wrap{max-width:1240px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:none;background:none;padding:2px 4px;color:var(--info)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card > h2{margin-bottom:12px}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.accent{border-top:3px solid var(--accent)}
.tiles.t6{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile.good .v{color:var(--good)} .tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--soft);padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
th.num,td.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.card .tw{border:none;border-radius:0;margin:0 -18px -18px;border-top:1px solid var(--line)}
tfoot td{font-weight:600;background:var(--soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.chip{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:6px;vertical-align:1px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1;min-width:200px;max-width:360px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
select.f,input.f{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 13px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:var(--surface)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .d{flex:none;width:46px;text-align:center;border-radius:8px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--ink));padding:4px 0;line-height:1.1}
.li .d b{display:block;font-family:var(--display);font-size:17px}
.li .d small{font-size:11px;color:var(--muted);text-transform:uppercase}
.li .t{min-width:0;flex:1}
.li .t span{display:block;font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .bl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:8px}
.bar .bt{height:9px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar .bf{height:100%;background:var(--accent);border-radius:5px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}

.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.welcome{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:22px}
.welcome p{max-width:66ch;color:var(--muted);margin:8px 0 14px}

/* Fenêtres */
.ov{position:fixed;inset:0;background:rgba(8,16,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:720px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{max-width:940px} .modal.small{max-width:440px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{flex:1}
.mb{padding:18px 20px}
.mf{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14.5px;width:100%;min-width:0}
.fld textarea{resize:vertical}
.hint{grid-column:1/-1;font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--soft);color:var(--ink)}
.lines th,.lines td{padding:6px}
.lines input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.lines td.num{min-width:110px}
.totals{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:4px;font-size:14.5px;color:var(--ink)}
.totals b{font-family:var(--display);font-size:19px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.paper{background:#fff;color:#1a2433;border:1px solid var(--line);border-radius:8px;padding:28px;overflow-x:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}

.tw table thead th{background:var(--mod);color:#fff;border-bottom:none;font-size:12.5px;letter-spacing:.02em}
.tw table tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--mod) 6%,var(--surface))}
.tw table tbody tr.click:hover td{background:color-mix(in srgb,var(--mod) 16%,var(--surface))}
.tw table tbody td:first-child{border-left:3px solid color-mix(in srgb,var(--mod) 55%,transparent)}
.tw table tfoot td{background:color-mix(in srgb,var(--mod) 16%,var(--surface));color:var(--ink);border-top:2px solid var(--mod)}
.tw{border-color:color-mix(in srgb,var(--mod) 35%,var(--line))}
.tw table td.num.pos{color:var(--good);font-weight:600} .tw table td.num.neg{color:var(--bad);font-weight:600}
.tiles .tile{--tc:var(--mod);background:color-mix(in srgb,var(--tc) 8%,var(--surface));border-color:color-mix(in srgb,var(--tc) 30%,var(--line));border-top:4px solid var(--tc)}
.tiles .tile .l{color:color-mix(in srgb,var(--tc) 75%,var(--ink));font-weight:600}
.tiles .tile:nth-child(6n+1){--tc:#2f7fe0} .tiles .tile:nth-child(6n+2){--tc:#16a34a} .tiles .tile:nth-child(6n+3){--tc:#9a3fd8}
.tiles .tile:nth-child(6n+4){--tc:#d97d22} .tiles .tile:nth-child(6n+5){--tc:#e0457a} .tiles .tile:nth-child(6n+6){--tc:#0d9488}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ph-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ph{width:90px;height:120px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#e6ebf1;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.who{display:flex;gap:10px;align-items:center}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.av.ini{display:inline-grid;place-items:center;background:color-mix(in srgb,var(--mod) 18%,var(--surface));color:var(--mod);font-weight:700;font-size:12px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gc,var(--mod));border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit}
.gcard:hover{box-shadow:0 6px 20px rgba(15,35,56,.12)}
.gcard h3{font-size:17px}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gc,var(--mod))}
.badges{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;background:var(--soft);padding:16px;border-radius:10px}
.ginfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;font-size:14px}
.ginfo div span{display:block;font-size:12px;color:var(--muted)}
@media (max-width:1000px){ .g3{grid-template-columns:1fr 1fr} .g32{grid-template-columns:1fr} }
@media (max-width:820px){
  .bgart{left:0}
  .tiles.t6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .app.open .side{transform:none}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:30}
  .top b{font-family:var(--display);font-size:15px}
  .top button{background:none;border:1px solid #2a4562;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
  .wrap{padding:18px 16px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
}
@media (max-width:420px){ .tiles.t6{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
/* Écran de connexion */
.gate{position:fixed;inset:0;z-index:100;background:var(--nav);display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.gate[hidden]{display:none}
.gate .box{background:var(--surface);border-radius:14px;padding:26px 24px 22px;width:100%;max-width:390px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.gate .gtop{display:flex;gap:11px;align-items:center;margin-bottom:2px}
.gate .gtop b{display:block;font-family:var(--display);font-size:16px;line-height:1.15;letter-spacing:.02em}
.gate .gtop small{color:var(--muted);font-size:12.5px}
.gate .fld span{font-size:13px}
.gate .fld input{padding:10px 12px;font-size:15px}
.gate .btn.primary{justify-content:center;padding:10px 14px;font-size:15px}
.gate .gmsg{font-size:13.5px;color:var(--muted);min-height:19px}
.gate .gmsg.bad{color:var(--bad);font-weight:600}
.gate .ghelp{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:2px 0 0}
.side .foot .lnk{border:none;background:none;color:#8fa6bd;cursor:pointer;padding:0;margin-left:8px;font-size:12px;text-decoration:underline}
.side .foot .who2{display:block;color:#8fa6bd;font-size:11.5px;overflow-wrap:anywhere;margin-top:2px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="box" id="loginForm" novalidate>
    <div class="gtop">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="15" fill="none" stroke="#d97d22" stroke-width="2.2"/>
        <ellipse cx="20" cy="20" rx="7" ry="15" fill="none" stroke="#235f9e" stroke-width="1.6"/>
        <path d="M5 20h30M8 12h24M8 28h24" stroke="#235f9e" stroke-width="1.4"/>
        <path d="M24 6l9 4-3 2-5-1-2 3-2-1 1-3-3-2z" fill="#0f2338"/>
      </svg>
      <div><b>AFRICA VISION VOYAGE</b><small>Gestion de l'agence</small></div>
    </div>
    <label class="fld" for="g_mail"><span>Adresse e-mail</span><input id="g_mail" type="email" autocomplete="username" inputmode="email" placeholder="vous@exemple.com"></label>
    <label class="fld" for="g_pass"><span>Mot de passe</span><input id="g_pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <div class="gmsg" id="g_msg" role="status"></div>
    <button class="btn primary" id="g_btn" type="submit">Se connecter</button>
    <button type="button" class="btn link" id="g_reset">Mot de passe oublié ?</button>
    <p class="ghelp">Les comptes sont créés par l'administrateur de l'agence. Si vous n'en avez pas encore, demandez-le-lui.</p>
  </form>
</div>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand" id="brand">

<script>
/* ============ Outils ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const iso = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const today = () => iso();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtN = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const fmtC = new Intl.NumberFormat('fr-FR', { notation: 'compact', maximumFractionDigits: 1 });
const money = v => fmtN.format(Math.round(num(v) * 100) / 100) + ' ' + CFG().devise;
const fdate = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : esc(s); };
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
const inRange = (d, a, b) => !!d && d >= a && d <= b;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============ Données ============ */
const COLS = ['clients','fournisseurs','billets','transports','hotels','circuits','visas','groupes','inscrits','factures','paiements','caisse'];
const S = {}; COLS.forEach(c => S[c] = []);
let CONF = {};
let mode = 'loading', db = null, downloads = null, gotData = false;
const FBCONF = {
  apiKey: "AIzaSyB2Cbf9dCUuXKG2EDJtdSq5hGXim7d6qtc",

  projectId: "gestion-comptable-15fc9",

  appId: "1:191996450348:web:deae64816726d289ee2389"
};

async function initStore() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      downloads = await window.claude.use('downloads').catch(() => null);
      canDl = !!downloads;
    }
  } catch (e) { canDl = false; }
  if (!window.firebase || typeof firebase.initializeApp !== 'function') {
    return startLocal("La base en ligne n'a pas pu être chargée. Vérifiez votre connexion internet, puis rechargez la page.");
  }
  try {
    firebase.initializeApp(FBCONF);
    auth = firebase.auth();
    db = firebase.firestore();
    try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
    try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  } catch (e) {
    return startLocal("La connexion à la base en ligne n'a pas pu s'ouvrir.");
  }
  auth.onAuthStateChanged(u => {
    if (u) {
      me = u; showGate(false);
      if (!started) { started = true; mode = 'cloud'; setStatus(); subscribe(); }
      else { setStatus(); schedule(); }
    } else if (started) { location.reload(); }
    else { me = null; gotData = true; showGate(true); render(); }
  });
}
function subscribe() {
  const total = COLS.length + 1;
  const timer = setTimeout(() => { if (loaded.size < total) { showBanner("Les données ne sont pas encore joignables. Vérifiez votre connexion : l'affichage peut être incomplet."); gotData = true; schedule(); } }, 10000);
  const done = () => { if (loaded.size >= total) { clearTimeout(timer); hideBanner(); } };
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) loaded.add(col);
      gotData = true; done(); schedule();
    }, err => { loaded.add(col); gotData = true; done(); handleErr(err); schedule(); });
  });
  db.doc('config/agence').onSnapshot(s => {
    CONF = s.exists ? { ...s.data() } : {};
    if (!s.metadata.fromCache) loaded.add('config');
    gotData = true; done(); schedule();
  }, err => { loaded.add('config'); gotData = true; done(); handleErr(err); schedule(); });
}
function startLocal(msg) {
  mode = 'local'; loadLocal(); gotData = true; showGate(false); setStatus(); render();
  if (msg) showBanner(msg);
}
/* ---------- Écran de connexion ---------- */
function showGate(on) {
  const g = $('#gate'); if (!g) return;
  g.hidden = !on;
  if (on) { const m = $('#g_mail'); if (m) setTimeout(() => { try { m.focus(); } catch (e) {} }, 60); }
}
function gateMsg(t, bad) { const el = $('#g_msg'); if (el) { el.textContent = t || ''; el.className = 'gmsg' + (bad ? ' bad' : ''); } }
function authMsg(code) {
  return ({
    'auth/invalid-email': "Cette adresse e-mail n'est pas valide.",
    'auth/user-not-found': "Aucun compte avec cette adresse. Demandez à l'administrateur de créer le vôtre.",
    'auth/wrong-password': "Mot de passe incorrect.",
    'auth/invalid-credential': "E-mail ou mot de passe incorrect.",
    'auth/invalid-login-credentials': "E-mail ou mot de passe incorrect.",
    'auth/missing-password': "Entrez votre mot de passe.",
    'auth/too-many-requests': "Trop de tentatives. Patientez quelques minutes avant de réessayer.",
    'auth/user-disabled': "Ce compte a été désactivé.",
    'auth/network-request-failed': "Pas de connexion. Vérifiez votre réseau, puis réessayez.",
    'auth/operation-not-allowed': "La connexion par e-mail n'est pas encore activée dans la console Firebase."
  })[code] || "La connexion n'a pas pu se faire. Réessayez.";
}
function bindGate() {
  const form = $('#loginForm'); if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!auth) return gateMsg("La connexion n'est pas prête. Rechargez la page.", true);
    const mail = $('#g_mail').value.trim(), pass = $('#g_pass').value;
    if (!mail || !pass) return gateMsg('Entrez votre e-mail et votre mot de passe.', true);
    const btn = $('#g_btn'); btn.disabled = true; gateMsg('Connexion…');
    try { await auth.signInWithEmailAndPassword(mail, pass); gateMsg(''); $('#g_pass').value = ''; }
    catch (err) { gateMsg(authMsg(err && err.code), true); }
    finally { btn.disabled = false; }
  });
  $('#g_reset').addEventListener('click', async () => {
    if (!auth) return;
    const mail = $('#g_mail').value.trim();
    if (!mail) return gateMsg("Entrez d'abord votre adresse e-mail, puis recliquez.", true);
    try { await auth.sendPasswordResetEmail(mail); gateMsg('Un e-mail de réinitialisation vous a été envoyé.'); }
    catch (err) { gateMsg(authMsg(err && err.code), true); }
  });
}
function loadLocal() {
  try { const raw = localStorage.getItem('avv-data'); if (raw) { const o = JSON.parse(raw); COLS.forEach(c => S[c] = o[c] || []); CONF = o.config || {}; } } catch (e) {}
}
function persistLocal() {
  try { const o = { config: CONF }; COLS.forEach(c => o[c] = S[c]); localStorage.setItem('avv-data', JSON.stringify(o)); } catch (e) {}
}
function handleErr(e) {
  const c = (e && e.code) || '';
  if (c === 'permission-denied' || c === 'invalid_argument') toast("Modification refusée : votre compte n'a pas le droit de modifier ces données.");
  else if (c === 'resource-exhausted' || c === 'quota_exceeded') toast("Capacité de stockage atteinte. Supprimez d'anciens enregistrements pour continuer.");
  else if (c === 'unauthenticated' || c === 'revoked') toast("Votre session a expiré. Reconnectez-vous.");
  else toast("Connexion momentanément indisponible. Réessayez dans un instant.");
}
async function save(col, rec) {
  const r = { ...rec };
  if (!r.id) r.id = uid();
  const now = new Date().toISOString();
  r.maj = now; if (!r.cree) r.cree = now;
  const body = { ...r }; delete body.id;
  Object.keys(body).forEach(k => { if (body[k] === undefined || k.startsWith('_')) delete body[k]; });
  if (mode === 'cloud') {
    try { await db.collection(col).doc(r.id).set(body); }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await sleep(400 + Math.random() * 600);
        try { await db.collection(col).doc(r.id).set(body); } catch (e2) { handleErr(e2); throw e2; }
      } else { handleErr(e); throw e; }
    }
  } else {
    const i = S[col].findIndex(x => x.id === r.id);
    if (i >= 0) S[col][i] = r; else S[col].push(r);
    persistLocal(); schedule();
  }
  return r;
}
async function remove(col, id) {
  if (mode === 'cloud') { try { await db.collection(col).doc(id).delete(); } catch (e) { handleErr(e); throw e; } }
  else { S[col] = S[col].filter(x => x.id !== id); persistLocal(); schedule(); }
}
async function saveConf(o) {
  if (mode === 'cloud') { try { await db.doc('config/agence').set(o); } catch (e) { handleErr(e); throw e; } }
  else { CONF = o; persistLocal(); schedule(); }
}
function setStatus() {
  const el = $('#status'); if (!el) return;
  if (mode === 'cloud') el.innerHTML = '<span class="dot ok"></span>Données enregistrées en ligne<button type="button" class="lnk" data-a="logout">Déconnexion</button>' + (me && me.email ? `<span class="who2">${esc(me.email)}</span>` : '');
  else el.innerHTML = '<span class="dot loc"></span>Mode local : données gardées dans ce navigateur';
}
function nextCode(col, prefix, year) {
  const pre = year ? `${prefix}-${year}-` : `${prefix}-`;
  let max = 0;
  S[col].forEach(r => { if (r.demo) return; const c = r.code || r.numero || ''; if (c.startsWith(pre)) { const n = parseInt(c.slice(pre.length), 10); if (n > max) max = n; } });
  return pre + String(max + 1).padStart(4, '0');
}

/* ============ Index calculés ============ */
let IX = { byId: {}, paid: {}, fourPaid: {}, fourAch: {} };
function buildIndex() {
  const byId = {}; COLS.forEach(c => { byId[c] = {}; S[c].forEach(r => byId[c][r.id] = r); });
  const paid = {}; S.paiements.forEach(p => { paid[p.factureId] = (paid[p.factureId] || 0) + num(p.montant); });
  const fourPaid = {}; S.caisse.forEach(m => { if (m.type === 'Sortie' && m.fournisseurId) fourPaid[m.fournisseurId] = (fourPaid[m.fournisseurId] || 0) + num(m.montant); });
  const fourAch = {};
  SERVICES.forEach(col => S[col].forEach(r => { if (r.fournisseurId && !isCancelled(r)) fourAch[r.fournisseurId] = (fourAch[r.fournisseurId] || 0) + num(r.achat); }));
  S.inscrits.forEach(i => { if (i.statut === 'Annulé') return; const g = S.groupes.find(x => x.id === i.groupeId); if (g && g.fournisseurId && g.statut !== 'Annulé') fourAch[g.fournisseurId] = (fourAch[g.fournisseurId] || 0) + num(g.achat); });
  IX = { byId, paid, fourPaid, fourAch };
}
const clientName = id => { const c = IX.byId.clients && IX.byId.clients[id]; return c ? c.nom : '—'; };
const fourName = id => { const f = IX.byId.fournisseurs && IX.byId.fournisseurs[id]; return f ? f.nom : '—'; };
const isCancelled = r => ['Annulé','Remboursé','Retiré'].includes(r.statut);
function fTotal(f) { return Math.max(0, sum(f.lignes || [], l => num(l.q) * num(l.pu)) - num(f.remise)); }
function fStat(f) {
  const total = fTotal(f), paye = IX.paid[f.id] || 0, rest = Math.max(0, total - paye);
  const ech = f.echeance || f.date;
  const retard = f.type === 'facture' && rest > 0.5 && ech && ech < today() ? daysBetween(ech, today()) : 0;
  let statut;
  if (f.type === 'devis') statut = f.factureId ? 'Converti' : (f.statutDevis || 'Brouillon');
  else if (total > 0 && rest <= 0.5) statut = 'Payée';
  else if (retard) statut = 'En retard';
  else if (paye > 0) statut = 'Partielle';
  else statut = 'Impayée';
  return { total, paye, reste: f.type === 'devis' ? 0 : rest, retard, statut };
}
const factures = () => S.factures.filter(f => f.type !== 'devis');

/* ============ Rendu principal ============ */
let rq = 0;
function schedule() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
const UI = { q: {}, st: {}, ftab: 'facture', cmonth: iso().slice(0, 7), r1: iso().slice(0, 8) + '01', r2: iso() };
let bannerMsg = '';
function showBanner(m) { bannerMsg = m; schedule(); }
function hideBanner() { if (bannerMsg) { bannerMsg = ''; schedule(); } }
function render() {
  buildIndex(); renderNav(); renderBrand();
  document.documentElement.style.setProperty('--mod', COLORS[route] || '#d97d22');
  const view = $('#view');
  const a = document.activeElement; const fid = a && a.id && view.contains(a) ? a.id : null;
  let sel = null; try { if (fid && a.selectionStart != null) sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  const top = $('#main').scrollTop;
  let html;
  if (!gotData) html = `<div class="empty">Chargement des données de l'agence…</div>`;
  else if (route === 'groupes') html = viewGroupes();
  else if (MOD[route]) html = viewList(route);
  else html = ({ tableau: viewDash, caisse: viewCaisse, factures: viewFactures, creances: viewCreances, rapports: viewRapports, parametres: viewParams })[route]();
  view.innerHTML = (bannerMsg ? `<div class="banner" role="status">${esc(bannerMsg)}</div>` : '') + (gotData ? demoBanner() : '') + html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  $('#main').scrollTop = top;
}
function demoBanner() {
  const n = COLS.reduce((a, c) => a + S[c].filter(r => r.demo).length, 0);
  return n ? `<div class="banner"><span>Des données d'exemple (${n} enregistrements) sont affichées pour découvrir la plateforme.</span><span class="sp"></span><button class="btn sm" data-a="demo-clear">Supprimer les exemples</button></div>` : '';
}
const head = (t, p, actions = '') => `<div class="head"><div><h1><span class="hic">${icon(ICON_OF[route])}</span>${t}</h1>${p ? `<p>${p}</p>` : ''}</div><div class="row">${actions}</div></div>`;
function table(cols, rows, opts = {}) {
  if (!rows.length) return `<div class="tw"><div class="empty">${opts.empty || 'Aucun enregistrement.'}</div></div>`;
  const th = cols.map(c => `<th class="${c[2] === 'money' ? 'num' : ''}">${c[0]}</th>`).join('') + (opts.act ? '<th></th>' : '');
  const tr = rows.map(r => `<tr class="${opts.click ? 'click' : ''}" ${opts.click ? `data-a="${opts.click}" data-id="${r.id}"` : ''}>` + cols.map(c => {
    const v = typeof c[1] === 'function' ? c[1](r) : r[c[1]];
    switch (c[2]) {
      case 'money': return `<td class="num${c[0] === 'Marge' ? (num(v) >= 0 ? ' pos' : ' neg') : /Reste|Solde dû/.test(c[0]) && num(v) > 0.5 ? ' neg' : ''}">${money(v)}</td>`;
      case 'date': return `<td class="tab">${fdate(v)}</td>`;
      case 'statut': return `<td>${pill(v)}</td>`;
      case 'html': return `<td>${v}</td>`;
      default: return `<td>${esc(v === undefined || v === '' ? '—' : v)}</td>`;
    }
  }).join('') + (opts.act ? `<td class="act">${opts.act(r)}</td>` : '') + '</tr>').join('');
  const tf = opts.foot ? `<tfoot><tr>${opts.foot}</tr></tfoot>` : '';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table></div>`;
}

/* ---------- Liste générique (clients, fournisseurs, services) ---------- */
function subtitle(col) {
  return { clients: 'Fichier clients, passeports et soldes', fournisseurs: 'Compagnies, hôtels, transporteurs, ambassades, et ce que vous leur devez', billets: "Réservations et émissions de billets d'avion", transports: 'Transferts, bus, locations de véhicules', hotels: "Réservations d'hôtels et d'hébergements", circuits: 'Séjours, circuits touristiques, voyages de groupe, Hajj et Omra', visas: "Suivi des demandes de visa et services d'assistance" }[col] || '';
}
function viewList(col) {
  const m = MOD[col], q = (UI.q[col] || '').toLowerCase().trim(), st = UI.st[col] || '';
  let rows = S[col].slice();
  if (q) rows = rows.filter(r => m.search(r).filter(Boolean).join(' ').toLowerCase().includes(q));
  if (st) rows = rows.filter(r => r.statut === st);
  const dk = m.date;
  rows.sort((a, b) => dk ? String(b[dk] || '').localeCompare(String(a[dk] || '')) : String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));
  const isSvc = SERVICES.includes(col);
  let tiles = '';
  if (isSvc) {
    const act = S[col].filter(r => !isCancelled(r));
    const mo = today().slice(0, 7);
    const mth = act.filter(r => (r.dateVente || '').startsWith(mo));
    const nonFact = act.filter(r => !r.factureId);
    tiles = `<div class="tiles">
      <div class="tile accent"><div class="l">Ventes du mois</div><div class="v">${money(sum(mth, r => r.vente))}</div><div class="s">${mth.length} dossier(s)</div></div>
      <div class="tile good"><div class="l">Marge du mois</div><div class="v">${money(sum(mth, r => num(r.vente) - num(r.achat)))}</div></div>
      <div class="tile"><div class="l">Dossiers actifs</div><div class="v">${act.length}</div><div class="s">${money(sum(act, r => r.vente))}</div></div>
      <div class="tile ${nonFact.length ? 'warn' : ''}"><div class="l">À facturer</div><div class="v">${nonFact.length}</div><div class="s">${money(sum(nonFact, r => r.vente))}</div></div></div>`;
  }
  const act = isSvc ? r => r.factureId && IX.byId.factures[r.factureId] ? `<button class="btn link sm" data-a="fact-open" data-id="${r.factureId}">${esc(IX.byId.factures[r.factureId].numero)}</button>` : (isCancelled(r) ? '' : `<button class="btn sm" data-a="svc-bill" data-col="${col}" data-id="${r.id}">Facturer</button>`)
    : col === 'clients' ? r => `<button class="btn sm" data-a="client-fiche" data-id="${r.id}">Fiche</button>`
    : r => { const du = (IX.fourAch[r.id] || 0) - (IX.fourPaid[r.id] || 0); return du > 0.5 ? `<button class="btn sm" data-a="four-pay" data-id="${r.id}">Payer</button>` : ''; };
  const vi = m.cols.findIndex(c => c[0] === 'Vente');
  const foot = isSvc && rows.length ? `<td colspan="${vi}">Total (${rows.length})</td><td class="num">${money(sum(rows, r => r.vente))}</td><td class="num">${money(sum(rows, r => num(r.vente) - num(r.achat)))}</td><td colspan="2"></td>` : '';
  return head(m.label, subtitle(col), `<button class="btn" data-a="csv" data-col="${col}">Exporter (CSV)</button><button class="btn primary" data-a="new" data-col="${col}">+ Nouveau ${m.one}</button>`) + tiles +
    `<div class="tools"><input class="search" id="q_${col}" type="search" placeholder="Rechercher…" value="${esc(UI.q[col] || '')}" data-in="q" data-col="${col}" aria-label="Rechercher">` +
    (m.statuts ? `<select class="f" id="st_${col}" data-ch="st" data-col="${col}" aria-label="Filtrer par statut"><option value="">Tous les statuts</option>${m.statuts.map(s => `<option${s === st ? ' selected' : ''}>${s}</option>`).join('')}</select>` : '') +
    `<span class="muted">${rows.length} résultat(s)</span></div>` +
    table(m.cols, rows, { click: 'edit:' + col, act, foot, empty: S[col].length ? 'Aucun résultat pour cette recherche.' : `Aucun ${m.one} pour l'instant. Cliquez sur « + Nouveau ${m.one} ».` });
}

function monthKeys(n) { const out = []; const d = new Date(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`); } return out; }
function viewDash() {
  const empty = COLS.every(c => !S[c].length);
  const t = today(), mo = t.slice(0, 7), d = new Date();
  const fa = factures();
  const faM = fa.filter(f => (f.date || '').startsWith(mo));
  const encM = sum(S.paiements.filter(p => (p.date || '').startsWith(mo)), p => p.montant);
  const creances = sum(fa, f => fStat(f).reste);
  const retard = fa.filter(f => fStat(f).retard);
  const svc = SERVICES.flatMap(c => S[c].filter(r => !isCancelled(r)).map(r => ({ ...r, _col: c })));
  const svcM = svc.filter(r => (r.dateVente || '').startsWith(mo));
  const dettes = sum(S.fournisseurs, f => Math.max(0, (IX.fourAch[f.id] || 0) - (IX.fourPaid[f.id] || 0)));

  const welcome = empty ? `<div class="welcome"><h2>Bienvenue dans votre espace de gestion</h2><p>Enregistrez vos clients et fournisseurs, puis vos ventes : billets, transports, hôtels, voyages, visas. Les factures, la caisse, les créances et les rapports se remplissent à partir de ces ventes. Pour découvrir la plateforme, chargez quelques dossiers d'exemple ; vous pourrez les supprimer en un clic.</p><div class="row"><button class="btn primary" data-a="demo-load">Charger des exemples</button><button class="btn" data-a="new" data-col="clients">Ajouter un premier client</button><a class="btn" href="#parametres">Renseigner les informations de l'agence</a></div></div>` : '';

  const series = monthKeys(6).map(k => ({ k, f: sum(fa.filter(f => (f.date || '').startsWith(k)), fTotal), e: sum(S.paiements.filter(p => (p.date || '').startsWith(k)), p => p.montant) }));
  const mixM = SERVICES.map(c => ({ c, l: MOD[c].label, v: sum(svcM.filter(r => r._col === c), r => r.vente) }));
  const useM = mixM.some(x => x.v);

  const mixMax = Math.max(1, ...mix.map(x => x.v));

  const lim = addDays(t, 30);

    ...S.groupes.filter(g => g.statut !== 'Annulé' && inRange(g.dateDepart, t, lim)).map(g => ({ d: g.dateDepart, t: `Départ du groupe ${g.nom}`, s: `${S.inscrits.filter(i => i.groupeId === g.id && i.statut !== 'Annulé').length} pèlerin(s) · ${g.destination || ''}`, st: g.statut, col: 'groupes', id: g.id })),
    ...S.billets.filter(r => !isCancelled(r) && inRange(r.dateDepart, t, lim)).map(r => ({ d: r.dateDepart, t: `Vol ${r.depart} → ${r.arrivee}`, s: `${clientName(r.clientId)} · ${r.compagnie || ''}`, st: r.statut, col: 'billets', id: r.id })),
    ...S.hotels.filter(r => !isCancelled(r) && inRange(r.arrivee, t, lim)).map(r => ({ d: r.arrivee, t: `Arrivée ${r.hotel}`, s: `${clientName(r.clientId)} · ${r.ville || ''}`, st: r.statut, col: 'hotels', id: r.id })),
    ...S.transports.filter(r => !isCancelled(r) && inRange(r.date, t, lim)).map(r => ({ d: r.date, t: r.itineraire, s: `${clientName(r.clientId)} · ${r.typeT || ''}`, st: r.statut, col: 'transports', id: r.id })),
    ...S.circuits.filter(r => !isCancelled(r) && inRange(r.debut, t, lim)).map(r => ({ d: r.debut, t: r.nom, s: `${clientName(r.clientId)} · ${r.destination || ''}`, st: r.statut, col: 'circuits', id: r.id })),
    ...S.visas.filter(r => !isCancelled(r) && inRange(r.dateRdv, t, lim)).map(r => ({ d: r.dateRdv, t: `Rendez-vous visa ${r.pays}`, s: `${clientName(r.clientId)} · ${r.typeVisa || ''}`, st: r.statut, col: 'visas', id: r.id })),
  ].sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8);

  const visasEnCours = S.visas.filter(v => ['Dossier en préparation','Déposé','En traitement'].includes(v.statut));
  const pp = S.clients.filter(c => c.passeportExp && c.passeportExp <= addDays(t, 183)).sort((a, b) => a.passeportExp.localeCompare(b.passeportExp));
  const dayHead = x => { const p = x.split('-'); return `<div class="d"><b>${p[2]}</b><small>${MOIS[+p[1] - 1]}</small></div>`; };
  const alerts = [
    ...retard.sort((a, b) => fStat(b).retard - fStat(a).retard).slice(0, 5).map(f => `<div class="li"><div class="t"><b>${esc(f.numero)}</b> · ${esc(clientName(f.clientId))}<span>${money(fStat(f).reste)} en retard de ${fStat(f).retard} jour(s)</span></div><button class="btn sm" data-a="pay-new" data-id="${f.id}">Encaisser</button></div>`),
    ...visasEnCours.slice(0, 4).map(v => `<div class="li"><div class="t"><b>Visa ${esc(v.pays)}</b> · ${esc(clientName(v.clientId))}<span>${v.dateRdv ? 'Rendez-vous le ' + fdate(v.dateRdv) : 'Pas de rendez-vous saisi'}</span></div>${pill(v.statut)}</div>`),
    ...pp.slice(0, 4).map(c => `<div class="li"><div class="t"><b>Passeport de ${esc(c.nom)}</b><span>${c.passeportExp < t ? 'Expiré le' : 'Expire le'} ${fdate(c.passeportExp)}</span></div><span class="pill ${c.passeportExp < t ? 'bad' : 'warn'}">${c.passeportExp < t ? 'Expiré' : 'Moins de 6 mois'}</span></div>`),
  ];

  return head('Tableau de bord', `${d.getDate()} ${MOISL[d.getMonth()]} ${d.getFullYear()} · ${esc(CFG().nom)}`, `<button class="btn" data-a="new-fact">Nouvelle facture</button><button class="btn primary" data-a="new" data-col="billets">+ Vendre un billet</button>`) + welcome +
  `<div class="tiles t6">
    <div class="tile accent"><div class="l">Facturé en ${MOISL[d.getMonth()]}</div><div class="v">${money(sum(faM, fTotal))}</div><div class="s">${faM.length} facture(s)</div></div>
    <div class="tile good"><div class="l">Encaissé ce mois</div><div class="v">${money(encM)}</div></div>
    <div class="tile good"><div class="l">Marge brute du mois</div><div class="v">${money(sum(svcM, r => num(r.vente) - num(r.achat)))}</div><div class="s">${svcM.length} vente(s) de services</div></div>
    <div class="tile"><div class="l">Solde de caisse</div><div class="v">${money(soldeCaisse())}</div><div class="s">tous moyens de paiement</div></div>
    <div class="tile ${creances > 0 ? 'warn' : ''}"><div class="l">Créances clients</div><div class="v">${money(creances)}</div><div class="s">${retard.length} facture(s) en retard</div></div>
    <div class="tile ${dettes > 0 ? 'bad' : ''}"><div class="l">Dû aux fournisseurs</div><div class="v">${money(dettes)}</div></div>
  </div>
  <div class="grid g32">
    <div class="card"><div class="ch"><h2>Facturé et encaissé, 6 derniers mois</h2><div class="legend"><span><i style="background:var(--accent)"></i>Facturé</span><span><i style="background:var(--info)"></i>Encaissé</span></div></div>${barChart(series)}</div>
    <div class="card"><h2>Ventes par activité ${useM ? '(ce mois)' : '(cumul)'}</h2><div class="bars">${mix.map(x => `<div class="bar"><div class="bl"><a href="#${x.c}" style="color:${COLORS[x.c]};font-weight:600">${x.l}</a><span class="num">${money(x.v)}</span></div><div class="bt"><div class="bf" style="width:${(x.v / mixMax * 100).toFixed(1)}%;background:${COLORS[x.c]}"></div></div></div>`).join('')}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Prochains départs et rendez-vous (30 jours)</h2><div class="list">${up.length ? up.map(u => `<div class="li" style="cursor:pointer;--dc:${COLORS[u.col]}" data-a="edit:${u.col}" data-id="${u.id}">${dayHead(u.d)}<div class="t"><b>${esc(u.t)}</b><span>${esc(u.s)}</span></div>${pill(u.st)}</div>`).join('') : '<div class="empty">Aucun départ prévu dans les 30 prochains jours.</div>'}</div></div>
    <div class="card"><h2>À surveiller</h2><div class="list">${alerts.length ? alerts.join('') : "<div class=\"empty\">Rien d'urgent : aucune facture en retard, aucun visa en attente, aucun passeport proche de l'expiration.</div>"}</div></div>
  </div>`;
}
function barChart(series) {
  const W = 600, H = 230, L = 58, R = 10, T = 14, B = 28;
  const max0 = Math.max(1, ...series.flatMap(s => [s.f, s.e]));
  const p = Math.pow(10, Math.floor(Math.log10(max0)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => max0 / x <= 4) || p * 10;
  const max = Math.ceil(max0 / step) * step;
  const y = v => T + (H - T - B) * (1 - v / max);
  const gw = (W - L - R) / series.length, bw = Math.min(26, gw / 3);
  let g = '';
  for (let i = 0; i * step <= max + 1e-9; i++) { const v = i * step; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtC.format(v)}</text>`; }
  series.forEach((s, i) => {
    const cx = L + gw * i + gw / 2, [yy, mm] = s.k.split('-'), last = i === series.length - 1;
    g += `<rect x="${cx - bw - 2}" y="${y(s.f)}" width="${bw}" height="${Math.max(0, H - B - y(s.f))}" rx="3" fill="var(--accent)" opacity="${last ? 1 : .78}"><title>Facturé ${MOISL[+mm - 1]} : ${money(s.f)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${y(s.e)}" width="${bw}" height="${Math.max(0, H - B - y(s.e))}" rx="3" fill="var(--info)" opacity="${last ? 1 : .78}"><title>Encaissé ${MOISL[+mm - 1]} : ${money(s.e)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="${last ? 'font-weight:600;fill:var(--ink)' : ''}">${MOIS[+mm - 1]} ${yy.slice(2)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Montants facturés et encaissés sur 6 mois">${g}</svg>`;
}

/* ---------- Caisse ---------- */
const MODES = ['Espèces','Orange Money','MTN Mobile Money','Virement bancaire','Chèque','Carte bancaire'];
function journal() {
  const pays = S.paiements.map(p => { const f = IX.byId.factures[p.factureId]; return { id: p.id, src: 'paiements', date: p.date, type: 'Entrée', categorie: 'Règlement client', libelle: `${f ? f.numero : 'Facture'} · ${clientName(p.clientId || (f && f.clientId))}`, mode: p.mode, montant: num(p.montant), demo: p.demo }; });
  const mv = S.caisse.map(m => ({ id: m.id, src: 'caisse', date: m.date, type: m.type, categorie: m.categorie, libelle: (m.libelle || '') + (m.fournisseurId ? ` · ${fourName(m.fournisseurId)}` : ''), mode: m.mode, montant: num(m.montant), demo: m.demo }));
  return [...pays, ...mv].sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
const soldeCaisse = () => sum(journal(), j => j.type === 'Entrée' ? j.montant : -j.montant);
function viewCaisse() {
  const J = journal(), mo = UI.cmonth;
  const JM = J.filter(j => (j.date || '').startsWith(mo));
  const ent = sum(JM, j => j.type === 'Entrée' ? j.montant : 0), sor = sum(JM, j => j.type === 'Sortie' ? j.montant : 0);
  const byMode = MODES.map(m => ({ m, v: sum(J.filter(j => (j.mode || 'Espèces') === m), j => j.type === 'Entrée' ? j.montant : -j.montant) })).filter(x => Math.abs(x.v) > 0.001);
  const cats = {}; JM.filter(j => j.type === 'Sortie').forEach(j => cats[j.categorie || 'Autre'] = (cats[j.categorie || 'Autre'] || 0) + j.montant);
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const [yy, mm] = mo.split('-'); const ml = `${MOISL[+mm - 1]} ${yy}`;
  return head('Caisse & finances', "Les règlements clients s'ajoutent automatiquement. Saisissez ici les autres entrées et toutes les dépenses.", `<button class="btn" data-a="mv-new" data-type="Entrée">+ Entrée</button><button class="btn primary" data-a="mv-new" data-type="Sortie">+ Dépense / sortie</button>`) +
  `<div class="tiles">
    <div class="tile accent"><div class="l">Solde de caisse actuel</div><div class="v">${money(soldeCaisse())}</div></div>
    <div class="tile good"><div class="l">Entrées (${ml})</div><div class="v">${money(ent)}</div></div>
    <div class="tile bad"><div class="l">Sorties (${ml})</div><div class="v">${money(sor)}</div></div>
    <div class="tile ${ent - sor >= 0 ? 'good' : 'bad'}"><div class="l">Résultat de trésorerie du mois</div><div class="v">${money(ent - sor)}</div></div>
  </div>
  <div class="grid g32">
    <div class="card"><div class="ch"><h2>Journal de caisse</h2><div class="row"><label class="muted" for="cmonth">Mois</label><input class="f" type="month" id="cmonth" value="${mo}" data-ch="cmonth"><button class="btn sm" data-a="csv-caisse">CSV</button></div></div>
    ${JM.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Libellé</th><th>Mode</th><th class="num">Entrée</th><th class="num">Sortie</th></tr></thead><tbody>${JM.map(j => `<tr class="click" data-a="${j.src === 'caisse' ? 'mv-edit' : 'pay-edit'}" data-id="${j.id}"><td class="tab">${fdate(j.date)}</td><td>${esc(j.libelle)}${j.demo ? '<span class="chip">exemple</span>' : ''}<span class="sub">${esc(j.categorie || '')}</span></td><td>${esc(j.mode || '—')}</td><td class="num" style="color:var(--good)">${j.type === 'Entrée' ? money(j.montant) : ''}</td><td class="num" style="color:var(--bad)">${j.type === 'Sortie' ? money(j.montant) : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total du mois</td><td class="num">${money(ent)}</td><td class="num">${money(sor)}</td></tr></tfoot></table></div>` : '<div class="empty">Aucun mouvement ce mois-ci.</div>'}</div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Soldes par moyen de paiement</h2>${byMode.length ? `<div class="list">${byMode.map(x => `<div class="li"><div class="t">${esc(x.m)}</div><b class="num" style="color:${x.v < 0 ? 'var(--bad)' : 'inherit'}">${money(x.v)}</b></div>`).join('')}</div>` : '<div class="empty">Aucun mouvement.</div>'}</div>
      <div class="card"><h2>Dépenses du mois par catégorie</h2>${catList.length ? `<div class="bars">${catList.map(([c, v]) => `<div class="bar"><div class="bl"><span>${esc(c)}</span><span class="num">${money(v)}</span></div><div class="bt"><div class="bf" style="width:${(v / catList[0][1] * 100).toFixed(1)}%;background:var(--bad)"></div></div></div>`).join('')}</div>` : '<div class="empty">Aucune dépense ce mois-ci.</div>'}</div>
    </div>
  </div>`;
}

  const buckets = [['Pas encore échues', x => !x._s.retard], ['1 à 30 jours de retard', x => x._s.retard > 0 && x._s.retard <= 30], ['31 à 60 jours de retard', x => x._s.retard > 30 && x._s.retard <= 60], ['Plus de 60 jours de retard', x => x._s.retard > 60]];
  const pays = S.paiements.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const dettes = S.fournisseurs.map(f => ({ ...f, _a: IX.fourAch[f.id] || 0, _p: IX.fourPaid[f.id] || 0 })).filter(f => f._a - f._p > 0.5).sort((a, b) => (b._a - b._p) - (a._a - a._p));
  return head('Créances & paiements', 'Ce que vos clients vous doivent, les règlements reçus, et ce que vous devez à vos fournisseurs.', `<button class="btn primary" data-a="pay-new">+ Enregistrer un paiement</button>`) +

  <div class="card"><div class="ch"><h2>Factures non soldées</h2><span class="muted">Total dû : <b>${money(sum(open, x => x._s.reste))}</b></span></div>
  ${table([['Facture', f => `<b>${esc(f.numero)}</b>`, 'html'], ['Client', f => `${esc(clientName(f.clientId))}<span class="sub">${esc((IX.byId.clients[f.clientId] || {}).telephone || '')}</span>`, 'html'], ['Échéance', 'echeance', 'date'], ['Total', f => f._s.total, 'money'], ['Reste dû', f => f._s.reste, 'money'], ['Situation', f => f._s.retard ? `<span class="pill bad">${f._s.retard} j de retard</span>` : `<span class="pill">${daysBetween(t, f.echeance || t)} j restants</span>`, 'html']], open, { click: 'fact-open', act: f => `<button class="btn sm" data-a="pay-new" data-id="${f.id}">Encaisser</button>`, empty: 'Toutes les factures sont réglées.' })}</div>

    <div class="card"><h2>Dettes fournisseurs</h2>
    ${table([['Fournisseur', f => `${esc(f.nom)}<span class="sub">${esc(f.categorie || '')}</span>`, 'html'], ['Achats', '_a', 'money'], ['Payé', '_p', 'money'], ['Reste', f => f._a - f._p, 'money']], dettes, { act: f => `<button class="btn sm" data-a="four-pay" data-id="${f.id}">Payer</button>`, empty: "Vous ne devez rien à vos fournisseurs. Les achats viennent des ventes où un fournisseur et un prix d'achat sont saisis." })}</div>
  </div>`;
}

/* ---------- Rapports ---------- */
function viewRapports() {

function openModal({ title, body, foot = '', size = '' }, layer = 'ov') {
  const ov = $('#' + layer);
  ov.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  ov.hidden = false;
  const first = $('.mb input, .mb select, .mb textarea', ov); if (first) setTimeout(() => first.focus(), 30);
  return ov;
}
function closeModal(layer = 'ov') { const ov = $('#' + layer); ov.hidden = true; ov.innerHTML = ''; ov.onclick = null; }
function ask(msg, ok = 'Confirmer', danger = true) {
  return new Promise(res => {
    const ov = openModal({ title: 'Confirmation', body: `<p style="margin:0">${esc(msg)}</p>`, size: 'small', foot: `<span class="sp"></span><button type="button" class="btn" data-no>Annuler</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button>` }, 'ov2');
    ov.onclick = e => { if (e.target.closest('[data-yes]')) { closeModal('ov2'); res(true); } else if (e.target.closest('[data-no],[data-close]') || e.target === ov) { closeModal('ov2'); res(false); } };
  });
}
let toastT;
function toast(m) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 4200); }

function optsClients(v) { return `<option value="">Choisir un client…</option>` + S.clients.slice().sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr')).map(c => `<option value="${c.id}"${c.id === v ? ' selected' : ''}>${esc(c.nom)}${c.telephone ? ' · ' + esc(c.telephone) : ''}</option>`).join(''); }
function optsFour(v) { return `<option value="">Aucun</option>` + S.fournisseurs.slice().sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr')).map(c => `<option value="${c.id}"${c.id === v ? ' selected' : ''}>${esc(c.nom)}${c.categorie ? ' (' + esc(c.categorie) + ')' : ''}</option>`).join(''); }
function fieldHTML(f, v) {
  const id = 'f_' + f.k, rq = f.req ? ' required' : '';
  let inp;
  switch (f.t) {
    case 'select': inp = `<select id="${id}" name="${f.k}">${f.o.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'client': inp = `<div class="row" style="flex-wrap:nowrap;gap:6px"><select id="${id}" name="${f.k}"${rq} style="flex:1;min-width:0">${optsClients(v)}</select><button type="button" class="btn sm" data-a="quick-client" title="Créer un nouveau client">+ Nouveau</button></div>`; break;

}
const SILH = '<svg viewBox="0 0 60 80" width="100%" height="100%" aria-hidden="true"><rect width="60" height="80" fill="#e6ebf1"/><circle cx="30" cy="30" r="13" fill="#b7c3d1"/><path d="M6 80c2-17 12-26 24-26s22 9 24 26z" fill="#b7c3d1"/></svg>';
function photoField(v) {
  return `<div class="fld full"><span>Photo du client</span><div class="ph-row"><div class="ph">${v ? `<img src="${v}" alt="Photo">` : SILH}</div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div class="row"><label class="btn sm primary" for="f_photo_file" style="cursor:pointer">${v ? 'Changer la photo' : 'Ajouter une photo'}</label><input type="file" accept="image/*" id="f_photo_file" data-photo class="vh"><button type="button" class="btn sm danger" data-photo-del${v ? '' : ' hidden'}>Retirer</button></div>
  <small class="muted">Photo de face, type photo d'identité. Elle apparaît sur la fiche, la liste du groupe et le badge.</small></div>
  <input type="hidden" name="photo" value="${esc(v || '')}"></div></div>`;

async function readPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = 240, H = 320, r = W / H, iw = img.naturalWidth, ih = img.naturalHeight;
    let sw = iw, sh = iw / r; if (sh > ih) { sh = ih; sw = ih * r; }
    const sx = (iw - sw) / 2, sy = Math.max(0, (ih - sh) / 2 - (ih - sh) * 0.15);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    return cv.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}
function bindPhoto(form) {
  const hid = form.elements.photo; if (!hid) return;
  const box = form.querySelector('.ph'), del = form.querySelector('[data-photo-del]'), lab = form.querySelector('label[for$="photo_file"]');
  form.addEventListener('change', async e => {
    if (!e.target.matches('[data-photo]')) return; e.stopPropagation();
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) return toast('Choisissez une image (JPG ou PNG).');
    try { const d = await readPhoto(f); hid.value = d; box.innerHTML = `<img src="${d}" alt="Photo">`; del.hidden = false; if (lab) lab.textContent = 'Changer la photo'; }
    catch (_) { toast("Impossible de lire cette image. Essayez une autre photo."); }
    e.target.value = '';
  });
  form.addEventListener('click', e => { if (e.target.closest('[data-photo-del]')) { hid.value = ''; box.innerHTML = SILH; del.hidden = true; if (lab) lab.textContent = 'Ajouter une photo'; } });
}
function avatar(c, size = 34) {
  if (c && c.photo) return `<img class="av" src="${c.photo}" alt="" style="width:${size}px;height:${size}px">`;
  const ini = String((c && c.nom) || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return `<span class="av ini" style="width:${size}px;height:${size}px">${esc(ini)}</span>`;
}
const ageOf = d => { if (!d) return ''; const a = daysBetween(d, today()) / 365.25; return a > 0 ? Math.floor(a) + ' ans' : ''; };
function readForm(form, fields) {
  const o = {};
  fields.forEach(f => { const el = form.elements[f.k]; if (!el) return; let v = el.value.trim(); if (f.t === 'money') v = v === '' ? 0 : num(v); else if (f.t === 'number') v = v === '' ? '' : num(v); o[f.k] = v; });
  return o;
}
function validate(form, fields) {
  for (const f of fields) { if (!f.req) continue; const el = form.elements[f.k]; if (el && !String(el.value).trim()) { el.focus(); toast(`Le champ « ${f.l} » est obligatoire.`); return false; } }
  return true;
}

/* ---------- Formulaire générique ---------- */
function openForm(col, rec) {
  const m = MOD[col], isNew = !rec || !rec.id;
  const svc = SERVICES.includes(col);
  rec = isNew ? { statut: m.statuts ? m.statuts[0] : undefined, type: col === 'clients' ? 'Particulier' : undefined, dateVente: svc ? today() : undefined, ...(rec || {}) } : rec;
  const canBill = svc && !rec.factureId;
  const ov = openModal({ title: (isNew ? (m.newT || 'Nouveau ' + m.one) : 'Modifier ' + m.one) + (rec.code ? ' ' + rec.code : ''), size: 'wide',
    body: `<form class="form" id="frm" novalidate>${m.fields.map(f => fieldHTML(f, rec[f.k])).join('')}${svc ? '<div class="hint" id="mhint"></div>' : ''}</form>`,
    foot: `${!isNew ? '<button type="button" class="btn danger" data-del>Supprimer</button>' : ''}${col === 'inscrits' && rec.clientId ? '<button type="button" class="btn" data-cli>Fiche du client (photo, passeport)</button>' : ''}<span class="sp"></span><button type="button" class="btn" data-close>Annuler</button>${canBill ? '<button type="button" class="btn" data-bill>Enregistrer et facturer</button>' : ''}<button type="button" class="btn primary" data-save>Enregistrer</button>` });
  const form = $('#frm', ov);
  bindPhoto(form);
  const upd = () => { const h = $('#mhint', ov); if (!h) return; const v = num(form.elements.vente.value), a = num(form.elements.achat.value); h.innerHTML = `Marge sur ce dossier : <b style="color:${v - a >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(v - a)}</b>${v ? ` (${((v - a) / v * 100).toFixed(1).replace('.', ',')} %)` : ''}${rec.factureId && IX.byId.factures[rec.factureId] ? ` · facturé sur ${esc(IX.byId.factures[rec.factureId].numero)}` : ''}`; };
  form.addEventListener('input', upd); upd();
  form.onsubmit = e => e.preventDefault();
  ov.onclick = async e => {
    if (e.target === ov || e.target.closest('[data-close]')) return closeModal();
    if (e.target.closest('[data-a="quick-client"]')) return quickClient(form.elements.clientId);
    if (e.target.closest('[data-cli]')) { const c = IX.byId.clients[form.elements.clientId.value]; if (c) openForm('clients', c); return; }
    if (e.target.closest('[data-del]')) {
      if (col === 'groupes' && S.inscrits.some(i => i.groupeId === rec.id)) return toast("Ce groupe a des inscrits. Supprimez d'abord leurs inscriptions.");
      if (col === 'clients' && S.inscrits.some(i => i.clientId === rec.id)) return toast("Ce client est inscrit dans un groupe. Retirez d'abord son inscription.");
      if (await ask(`Supprimer définitivement ${col === 'inscrits' ? 'cette inscription' : 'ce ' + m.one} ?`, 'Supprimer')) { try { await remove(col, rec.id); closeModal(); toast('Supprimé.'); } catch (_) {} }
      return;
    }
    const bill = e.target.closest('[data-bill]');
    if (bill || e.target.closest('[data-save]')) {
      if (!validate(form, m.fields)) return;
      const data = { ...rec, ...readForm(form, m.fields) };
      if (col === 'inscrits' && S.inscrits.some(i => i.id !== data.id && i.groupeId === data.groupeId && i.clientId === data.clientId)) return toast('Ce client est déjà inscrit dans ce groupe.');
      if (isNew) data.code = nextCode(col, m.prefix);
      try {
        const saved = await save(col, data);
        closeModal(); toast(isNew ? 'Enregistré.' : 'Modifications enregistrées.');
        if (bill) billService(col, saved);
      } catch (_) {}
    }
  };
}
function quickClient(select) {
  const fields = MOD.clients.fields.filter(f => ['photo','nom','sexe','telephone','passeport','passeportExp','naissance'].includes(f.k));
  const ov = openModal({ title: 'Nouveau client', size: '', body: `<form class="form" id="qc" novalidate>${fields.map(f => fieldHTML({ ...f, full: f.k === 'photo' || f.k === 'nom' ? 1 : 0 }, '')).join('').replace(/id="f_/g, 'id="q_').replace(/for="f_/g, 'for="q_')}</form>`,
    foot: `<span class="sp"></span><button type="button" class="btn" data-close>Annuler</button><button type="button" class="btn primary" data-ok>Créer le client</button>` }, 'ov2');

      <label class="fld" for="f_notes"><span>Note sur le document</span><input id="f_notes" name="notes" type="text" value="${esc(f.notes || '')}" placeholder="Ex. : acompte de 50 % à la commande"></label>

    tots();
  };
  form.addEventListener('input', e => { const i = e.target.dataset.i; if (i !== undefined) { lignes[i][e.target.dataset.k] = e.target.value; const c = $('#lm' + i, ov); if (c) c.textContent = money(num(lignes[i].q) * num(lignes[i].pu)); } tots(); });
  form.addEventListener('change', e => {
    if (e.target.id === 'f_addsvc' && e.target.value) {
      const [c, id] = e.target.value.split('|'); const r = IX.byId[c][id];
      if (r) { if (lignes.length === 1 && !lignes[0].d && !num(lignes[0].pu)) lignes = []; lignes.push({ d: MOD[c].desc(r), q: 1, pu: num(r.vente) }); sources.push({ col: c, id }); if (!form.elements.clientId.value) form.elements.clientId.value = r.clientId || ''; e.target.querySelector(`option[value="${c}|${id}"]`)?.remove(); drawLines(); }

    const rm = e.target.closest('[data-rml]'); if (rm) { lignes.splice(+rm.dataset.rml, 1); if (!lignes.length) lignes.push({ d: '', q: 1, pu: 0 }); drawLines(); return; }
    if (e.target.closest('[data-del]')) {

      if (await ask(`Supprimer ${isD ? 'le devis' : 'la facture'} ${f.numero} ?`, 'Supprimer')) {

      const ls = lignes.filter(l => String(l.d).trim() || num(l.pu)).map(l => ({ d: String(l.d).trim(), q: num(l.q) || 1, pu: num(l.pu) }));
      if (!ls.length) return toast('Ajoutez au moins une ligne.');
      const data = { ...f, clientId: form.elements.clientId.value, date: form.elements.date.value || today(), echeance: form.elements.echeance.value, remise: num(form.elements.remise.value), notes: form.elements.notes.value.trim(), lignes: ls, sources };
      if (isD) data.statutDevis = form.elements.statutDevis.value;
      if (isNew) data.numero = nextCode('factures', isD ? 'DEV' : 'FAC', data.date.slice(0, 4));
      try {

        if (!isD) for (const s of sources) { const r = IX.byId[s.col] && IX.byId[s.col][s.id]; if (r && r.factureId !== saved.id) await save(s.col, { ...r, factureId: saved.id }); }
        closeModal(); toast(`${isD ? 'Devis' : 'Facture'} ${saved.numero} enregistré${isD ? '' : 'e'}.`);

    }
  };
}

function openFactView(id, fallback) {
  buildIndex();

  const st = fStat(f), isD = f.type === 'devis';
  const pays = S.paiements.filter(p => p.factureId === f.id).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const ov = openModal({ title: `${isD ? 'Devis' : 'Facture'} ${f.numero}`, size: 'wide',
    body: `<div class="row" style="margin-bottom:12px">${pill(st.statut)}${!isD ? `<span class="muted">Payé ${money(st.paye)} sur ${money(st.total)}${st.retard ? ` · ${st.retard} jour(s) de retard` : ''}</span>` : ''}${f.devisId && IX.byId.factures[f.devisId] ? `<span class="muted">Issue du devis ${esc(IX.byId.factures[f.devisId].numero)}</span>` : ''}${f.factureId && IX.byId.factures[f.factureId] ? `<span class="muted">Converti en facture ${esc(IX.byId.factures[f.factureId].numero)}</span>` : ''}</div>
      <div class="paper">${docHTML(f)}</div>
      ${pays.length ? `<h3 style="margin:16px 0 8px">Paiements reçus</h3>${table([['Date', 'date', 'date'], ['Mode', 'mode'], ['Référence', 'reference'], ['Montant', 'montant', 'money']], pays)}` : ''}`,

      const nf = { type: 'facture', clientId: f.clientId, date: t, echeance: addDays(t, num(CFG().echeance) || 15), lignes: f.lignes, remise: f.remise, notes: f.notes, sources: f.sources || [], devisId: f.id, numero: nextCode('factures', 'FAC', t.slice(0, 4)) };

/* ---------- Paiements clients ---------- */
function openPayForm(p, factureId) {
  const isNew = !p;
  p = p || { date: today(), mode: 'Espèces', factureId: factureId || '' };
  const open = factures().filter(f => fStat(f).reste > 0.5 || f.id === p.factureId);
  const reste = id => { const f = IX.byId.factures[id]; return f ? fStat(f).reste : 0; };
  if (isNew && p.factureId) p.montant = reste(p.factureId);
  const ov = openModal({ title: isNew ? 'Enregistrer un paiement client' : 'Modifier le paiement', body: `<form class="form" id="pf" novalidate>
    <label class="fld full" for="pp_f"><span>Facture réglée *</span><select id="pp_f" name="factureId"><option value="">Choisir la facture…</option>${open.map(f => `<option value="${f.id}"${f.id === p.factureId ? ' selected' : ''}>${esc(f.numero)} · ${esc(clientName(f.clientId))} · reste ${esc(money(fStat(f).reste))}</option>`).join('')}</select></label>
    <label class="fld" for="pp_d"><span>Date</span><input id="pp_d" name="date" type="date" value="${esc(p.date)}"></label>
    <label class="fld" for="pp_m"><span>Montant reçu *</span><input id="pp_m" name="montant" inputmode="decimal" value="${esc(p.montant || '')}" placeholder="0"></label>
    <label class="fld" for="pp_mo"><span>Mode de paiement</span><select id="pp_mo" name="mode">${MODES.map(m => `<option${m === p.mode ? ' selected' : ''}>${m}</option>`).join('')}</select></label>
    <label class="fld" for="pp_r"><span>Référence (n° de transaction, chèque…)</span><input id="pp_r" name="reference" value="${esc(p.reference || '')}"></label>
    <div class="hint" id="phint"></div></form>`,
    foot: `${!isNew ? '<button type="button" class="btn danger" data-del>Supprimer</button>' : ''}<span class="sp"></span><button type="button" class="btn" data-close>Annuler</button><button type="button" class="btn primary" data-save>Enregistrer</button>` });
  const form = $('#pf', ov);
  const hint = () => { const id = form.elements.factureId.value; const r = reste(id) + (p.id && p.factureId === id ? num(p.montant) : 0); $('#phint', ov).innerHTML = id ? `Reste à payer sur cette facture : <b>${money(r)}</b>. Le paiement apparaîtra aussi dans le journal de caisse.` : 'Le paiement apparaîtra aussi dans le journal de caisse.'; };
  form.addEventListener('change', e => { if (e.target.name === 'factureId' && isNew) form.elements.montant.value = reste(e.target.value) || ''; hint(); });
  hint();
  ov.onclick = async e => {
    if (e.target === ov || e.target.closest('[data-close]')) return closeModal();
    if (e.target.closest('[data-del]')) { if (await ask("Supprimer ce paiement ? La facture redeviendra due d'autant.", 'Supprimer')) { try { await remove('paiements', p.id); closeModal(); toast('Paiement supprimé.'); } catch (_) {} } return; }
    if (e.target.closest('[data-save]')) {
      const fid = form.elements.factureId.value, m = num(form.elements.montant.value);
      if (!fid) return toast('Choisissez la facture réglée.');
      if (m <= 0) return toast('Indiquez le montant reçu.');
      const f = IX.byId.factures[fid];
      try { await save('paiements', { ...p, factureId: fid, clientId: f ? f.clientId : '', date: form.elements.date.value || today(), montant: m, mode: form.elements.mode.value, reference: form.elements.reference.value.trim() }); closeModal(); toast(`Paiement de ${money(m)} enregistré.`); } catch (_) {}
    }
  };
}

/* ============ Exports ============ */
async function dl(filename, data) {
  if (downloads) {
    try { await downloads.save({ filename, data }); toast('Fichier prêt.'); }
    catch (e) { if (e && e.code === 'declined') toast('Téléchargement annulé.'); else if (e && e.code === 'rate_limited') toast('Une demande de téléchargement est déjà ouverte.'); else toast("Le téléchargement n'a pas pu se faire."); }
    return;
  }
  try {
    const type = /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : /\.json$/i.test(filename) ? 'application/json;charset=utf-8' : 'text/html;charset=utf-8';
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Fichier téléchargé. Ouvrez-le pour imprimer ou enregistrer en PDF.');
  } catch (e) { toast("Le téléchargement n'a pas pu se faire."); }
}
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
const plain = v => typeof v === 'number' ? String(Math.round(v * 100) / 100).replace('.', ',') : String(v ?? '');
function exportCol(col) {
  const m = MOD[col];
  const rows = [['Code', ...m.fields.map(f => f.l)], ...S[col].map(r => [r.code, ...m.fields.map(f => f.k === 'clientId' ? clientName(r[f.k]) : f.k === 'fournisseurId' ? (r[f.k] ? fourName(r[f.k]) : '') : plain(r[f.k]))])];
  dl(`${col}-${today()}.csv`, csv(rows));
}
function exportRapport() {
  const rows = [['Activité', 'N°', 'Date de vente', 'Client', 'Détail', 'Fournisseur', 'Statut', 'Achat', 'Vente', 'Marge']];
  SERVICES.forEach(c => S[c].filter(r => inRange(r.dateVente, UI.r1, UI.r2)).forEach(r => rows.push([MOD[c].label, r.code, r.dateVente, clientName(r.clientId), MOD[c].desc(r), r.fournisseurId ? fourName(r.fournisseurId) : '', r.statut, plain(num(r.achat)), plain(num(r.vente)), plain(num(r.vente) - num(r.achat))])));
  dl(`ventes-${UI.r1}-au-${UI.r2}.csv`, csv(rows));
}

async function setLogo(file) {
  if (!/^image\//.test(file.type)) return toast('Choisissez une image (PNG ou JPG).');
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 420 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    let data = cv.toDataURL('image/png');
    if (data.length > 180000) { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c2.width, c2.height); g.drawImage(cv, 0, 0); data = c2.toDataURL('image/jpeg', 0.86); }
    await saveConf({ ...CONF, logo: data }); toast('Logo enregistré.');
  } catch (e) { toast("Impossible de lire cette image. Essayez un autre fichier PNG ou JPG."); }
}

document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.ch; if (!k) return;
  if (k === 'logo') { const f = el.files && el.files[0]; if (f) setLogo(f); return; }
  if (k === 'st') UI.st[el.dataset.col] = el.value;
  else if (k === 'cmonth') UI.cmonth = el.value || iso().slice(0, 7);
  else if (k === 'r1' || k === 'r2') { UI[k] = el.value || UI[k]; if (UI.r1 > UI.r2) [UI.r1, UI.r2] = [UI.r2, UI.r1]; }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#ov2').hidden) closeModal('ov2'); else if (!$('#ov').hidden) closeModal(); } });
$('#menuBtn').addEventListener('click', () => $('#app').classList.toggle('open'));
window.addEventListener('hashchange', () => { readRoute(); $('#app').classList.remove('open'); $('#main').scrollTop = 0; render(); });
readRoute(); bindGate(); render(); initStore();
</script>
</body>
</html>
